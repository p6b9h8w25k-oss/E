<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مذاكرة الإنجليزي: الوحدة 3 و4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: one column study app, sticky tabs on top. Palette: paper grey ground, deep teal accent, green and red only for answer feedback. */
:root{--bg:#f3f5f4;--surface:#ffffff;--ink:#1b2624;--muted:#5b6b67;--line:#dbe3e0;--accent:#1d6b5a;--accent-soft:#e0efeb;--ok:#2a7a4b;--ok-soft:#e2f2e8;--bad:#a63b2f;--bad-soft:#f7e4e1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1514;--surface:#171f1d;--ink:#e4ece9;--muted:#9bb0aa;--line:#2b3834;--accent:#62c3a7;--accent-soft:#1c3530;--ok:#6fcf97;--ok-soft:#1b3727;--bad:#f0877b;--bad-soft:#3a2220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1514;--surface:#171f1d;--ink:#e4ece9;--muted:#9bb0aa;--line:#2b3834;--accent:#62c3a7;--accent-soft:#1c3530;--ok:#6fcf97;--ok-soft:#1b3727;--bad:#f0877b;--bad-soft:#3a2220;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.8;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.en{direction:ltr;unicode-bidi:isolate;text-align:left;display:inline-block}
.app{max-width:820px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:14px 6px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 6px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding-block:18px}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:16px;margin:18px 0 8px;color:var(--accent)}
p{margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:start;color:var(--ink);font:inherit;width:100%;min-width:0}
.card .t{font-weight:700}
.card .m{font-size:12.5px;color:var(--muted);margin-top:4px}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.rule{border-inline-start:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:8px;margin:10px 0}
.formula{background:var(--surface);border:1px dashed var(--accent);padding:10px 12px;border-radius:8px;margin:10px 0;font-weight:700;font-size:16px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.ex .en{white-space:normal}
.exar{color:var(--muted);font-size:14px;margin-top:2px}
.warn{background:var(--bad-soft);border-radius:8px;padding:10px 12px;margin:10px 0}
.scroll{overflow-x:auto;margin:8px 0}
table.vt{width:100%;border-collapse:collapse;background:var(--surface);font-size:14px;min-width:420px}
table.vt th,table.vt td{border:1px solid var(--line);padding:8px 10px;text-align:start;vertical-align:top}
table.vt th{background:var(--accent-soft);color:var(--accent);font-weight:700}
.back{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;margin-bottom:6px}
.quiz{border-top:2px solid var(--line);margin-top:20px;padding-top:6px}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:6px}
.progress{height:6px;background:var(--line);border-radius:4px;margin:8px 0 12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:16px;font-weight:500;margin:8px 0}
.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.fbox{border-radius:10px;padding:10px 12px;margin:10px 0}
.fbox.good{background:var(--ok-soft)}
.fbox.bad{background:var(--bad-soft)}
.fbox .exp{margin-top:4px;font-size:14px}
.btn{background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:10px;font:inherit;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.fillrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.fillrow input{flex:1 1 180px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.score{font-size:34px;font-weight:700;color:var(--accent);margin:6px 0}
.flash{min-height:200px;display:grid;place-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;cursor:pointer;margin:10px 0}
.fb-en{font-size:28px;font-weight:700}
.fb-ar{font-size:22px;font-weight:700;color:var(--accent)}
.fb-def{font-size:15px;margin-top:8px;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin-top:10px}
.fbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.count{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.center{text-align:center}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" dir="rtl">
  <header class="top">
    <h1>مذاكرة الإنجليزي: الصف الثالث الثانوي</h1>
    <div class="sub">الوحدة 3: What Will They Think of Next؟ · الوحدة 4: The World of TV</div>
    <nav class="tabs">
      <button data-v="u3">الوحدة 3</button>
      <button data-v="u4">الوحدة 4</button>
      <button data-v="cards">البطاقات</button>
      <button data-v="tests">الاختبارات العامة</button>
      <button data-v="result">النتيجة</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script>
/* ---------- state (per-viewer convenience only) ---------- */
const KEY = "eng34_v1";
let st = { lessons: {}, tests: {}, known: [] };
try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

const $ = s => document.querySelector(s);
const norm = s => s.toLowerCase().replace(/\s+/g, " ").trim();
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- html helpers ---------- */
const H = {
  p: t => `<p>${t}</p>`,
  h: t => `<h3>${t}</h3>`,
  rule: t => `<div class="rule">${t}</div>`,
  formula: t => `<div class="formula en">${t}</div>`,
  ex: (en, ar) => `<div class="ex"><div class="en">${en}</div><div class="exar">${ar}</div></div>`,
  warn: t => `<div class="warn">${t}</div>`,
  table: (head, rows) => `<div class="scroll"><table class="vt"><thead><tr>${head.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
};
const vocabTable = list => H.table(["English word", "المعنى بالعربي", "المعنى بالإنجليزي (من الكتاب)"],
  list.map(w => [`<b class="en">${w[0]}</b>`, w[1], `<span class="en">${w[2]}</span>`]));

/* question helpers */
const M = (q, o, a, ex) => ({ q, o, a, ex });   // multiple choice, a = index
const F = (q, answers, ex) => ({ q, a: answers, ex }); // type the answer, answers = accepted list

/* auto quiz for word lists: Arabic options, correct answer rotates position */
function vocabQuiz(list) {
  return list.map((w, i) => {
    const others = list.filter((_, j) => j !== i).map(x => x[1]).slice(0, 3);
    const pos = i % 4;
    const opts = others.slice();
    opts.splice(pos, 0, w[1]);
    return { q: `ما معنى الكلمة: <b class="en">${w[0]}</b> ؟`, o: opts, a: pos, ex: `<span class="en">${w[0]}</span> = ${w[2]}` };
  });
}

/* ---------- vocabulary data (English meanings copied from the book) ---------- */
const VQC3 = [
  ["circuits", "دوائر / مسارات التيار الكهربائي", "paths for electrical currents"],
  ["condensed", "مختصَر / مُكثَّف", "shortened"],
  ["determined", "مُقرَّر / محسوم", "decided"],
  ["extensively", "بشكل واسع / على نطاق واسع", "covering a wide range or area"],
  ["rank", "مرتبة / موقع في ترتيب", "position in an ordered group"],
  ["span", "يمتد عبر / يغطي المسافة", "extend across"]
];
const VVB3 = [
  ["chain", "سلسلة (محلات أو شركات تابعة لشركة واحدة)", "a group of businesses owned by the same company"],
  ["commonplace", "شائع / مألوف", "frequent or usual"],
  ["estimated", "تقديري / مُقدَّر", "given an approximate cost"],
  ["lucrative", "مُربِح / يدرّ أرباحاً كبيرة", "producing a lot of money"],
  ["orbit", "مدار (المسار حول كوكب أو قمر أو مركبة)", "a path in space followed by a planet, moon, or spacecraft"],
  ["rigorous", "صارم / شاق جداً", "extremely difficult"],
  ["simulate", "يحاكي / يقلّد", "imitate"],
  ["steep", "باهظ / مرتفع جداً (السعر)", "expensive"]
];
const RT3 = [
  ["lugging", "يحمل بعناء / يجرّ شيئاً ثقيلاً", "carrying, especially something heavy or awkward"],
  ["ditch", "يتخلّص من / يترك", "leave, get rid of"],
  ["check out", "يلقي نظرة على شيء ليقيّمه / يتفحّصه", "look at something in order to evaluate it"],
  ["go with the flow", "يتقبّل الأمور ويجاريها دون مقاومة", "accept things"],
  ["hoopla", "ضجة إعلامية / هيصة مبالغ فيها", "excitement created by a large amount of publicity"]
];
const VU4 = [
  ["altered", "مُعدَّل / متغيّر", "changed"],
  ["captivates", "يأسر / يستحوذ على الانتباه", "captures someone's attention"],
  ["confronts", "يواجه (شيئاً صعباً أو خطيراً)", "meets something difficult or dangerous"],
  ["crucial", "حاسم / بالغ الأهمية", "extremely important"],
  ["defects", "عيوب / نواقص", "imperfections"],
  ["enduring", "دائم / باقٍ مع الزمن", "lasting"],
  ["exotic", "غريب وجذّاب / غريب الطابع", "unusual and attractive"],
  ["ironically", "المفارقة أنّ... (عكس ما يبدو عليه)", "against the way it appears"],
  ["phenomenal", "رائع جداً / استثنائي", "great, remarkable"]
];
const RT4 = [
  ["just", "جداً / فعلاً (للتأكيد، وليس بمعنى فقط)", "really, very"],
  ["hard to swallow", "يصعب تصديقه", "not easy to believe"],
  ["a dime a dozen", "شيء متوفر بكثرة وقيمته قليلة", "something so common that it doesn't have much value"],
  ["doze off", "يغفو وينام دون قصد", "fall asleep"]
];

/* ---------- lessons ---------- */
const LESSONS = [
  /* ===== Unit 3 ===== */
  { id: "3a", unit: 3, title: "Quick Check: المفردات",
    body: H.p("هذي كلمات تمارين Quick Check A. احفظ كل كلمة مع معناها بالعربي والإنجليزي، ثم اختبر نفسك.") + vocabTable(VQC3),
    quiz: vocabQuiz(VQC3) },
  { id: "3b", unit: 3, title: "Vocabulary Building: المفردات",
    body: H.p("كلمات الصفحة 40 و41 (Vocabulary Building). لاحظ أن كلمة مثل <span class='en'>steep</span> معناها هنا 'باهظ' وليس 'منحدر'، فالمعنى يعتمد على السياق.") + vocabTable(VVB3),
    quiz: vocabQuiz(VVB3) },
  { id: "3c", unit: 3, title: "Real Talk: عبارات المحادثة",
    body: H.p("هذي عبارات عامية تسمعها في الكلام، ومعناها غالباً يختلف عن الترجمة الحرفية. ركّز على شرح الاستخدام تحت الجدول.") + vocabTable(RT3) +
      H.h("شرح الاستخدام في المحادثة") +
      H.rule("<b class='en'>lugging</b>: تصف حمل شيء ثقيل أو مزعج، والإحساس فيها بالتعب والعناء.") +
      H.ex("I was lugging my suitcases all the way to the station.", "كنت أجرّ حقائبي طول الطريق إلى المحطة.") +
      H.rule("<b class='en'>ditch</b>: في الكلام اليومي تعني 'أترك' أو 'ألغي' بشكل غير رسمي.") +
      H.ex("Let's ditch the meeting and grab lunch.", "خلينا نلغي الاجتماع ونروح نتغدى.") +
      H.rule("<b class='en'>check out</b>: في المحادثة تعني 'شوف / جرّب وقيّم'. وانتبه: لها معنى ثاني في الفندق (تسجيل الخروج).") +
      H.ex("You should check out this new app.", "لازم تجرب هالتطبيق الجديد وتشوف رأيك فيه.") +
      H.rule("<b class='en'>go with the flow</b>: مو معناها 'اتبع التيار' حرفياً. تعني تقبل الأمور وما تقاومها أو تخطط لكل شي.") +
      H.ex("I don't mind where we eat. I'll just go with the flow.", "ما عندي مانع وين نتغدى، أنا بس أجاري الموضوع.") +
      H.rule("<b class='en'>hoopla</b>: غالباً تُقال بنبرة فيها اعتراض على المبالغة في الضجة.") +
      H.ex("All the hoopla about the new phone is a bit much.", "كل هالضجة عن الجوال الجديد فيها مبالغة شوي."),
    quiz: vocabQuiz(RT3).concat([
      M("ما معنى الجملة: <span class='en'>\"I'll just go with the flow.\"</span> ؟", ["أخطط لكل شيء بعناية", "أقبل بأي شيء يصير وما أقاوم", "أوقف النهر", "أركض بسرعة"], 1, "go with the flow = تقبل الأمور"),
      M("ما معنى <span class='en'>ditch</span> في: <span class='en'>\"Let's ditch the plan.\"</span>", ["نحافظ على الخطة", "نترك الخطة ونتخلص منها", "نطبع الخطة", "نكتب الخطة"], 1, "ditch = يترك / يتخلص من")
    ]) },
  { id: "3d", unit: 3, title: "Future Perfect (المستقبل التام)",
    body: H.p("المستقبل التام يُستخدم للكلام عن شيء <b>راح يكتمل قبل</b> وقت محدد في المستقبل، أو قبل حدث ثاني في المستقبل.") +
      H.formula("subject + will have + V3") +
      H.rule("<b>V3</b> هي الصيغة الثالثة للفعل (الماضي التام): finish ← finished، find ← found، introduce ← introduced.") +
      H.h("كلمات تدل عليه") +
      H.p("<span class='en'>by 2030 / by next year / by Friday</span> و <span class='en'>by the time ...</span>") +
      H.h("أمثلة") +
      H.ex("By the time my children are grown, scientists <b>will have found</b> a solution to global warming.", "بحلول الوقت اللي يكبر فيه أولادي، يكون العلماء قد وجدوا حلاً للاحتباس الحراري.") +
      H.ex("The car company <b>will have introduced</b> their new models by November.", "شركة السيارات راح تكون قد أطلقت موديلاتها الجديدة بحلول نوفمبر.") +
      H.h("النفي والسؤال") +
      H.ex("They <b>won't have finished</b> the project by Friday.", "ما راح يكونون خلصوا المشروع بحلول الجمعة.") +
      H.ex("<b>Will</b> they <b>have finished</b> the project by Friday?", "هل راح يكونون قد خلصوا المشروع بحلول الجمعة؟") +
      H.warn("<b>انتبه:</b> بعد <span class='en'>by the time</span> نستخدم المضارع البسيط (are) وليس will: <span class='en'>by the time my children are grown</span> ✓") +
      H.warn("خطأ شائع: <span class='en'>By 2030 I will have finish.</span> ✗ الصح: <span class='en'>I will have finished.</span> ✓"),
    quiz: [
      M("By next June, I ___ my English course.", ["will finish", "will have finished", "have will finished", "finished"], 1, "المستقبل التام = will have + V3"),
      M("Scientists ___ a cure by 2040.", ["will have found", "will found", "have found will", "found"], 0, "found = V3 للفعل find"),
      M("The company will have ___ its app by Monday.", ["launch", "launched", "launching", "launches"], 1, "بعد will have نستخدم V3 = launched"),
      F("By 9 p.m., they ___ (complete) the report.", ["will have completed"], "will have + completed"),
      F("Will you ___ (finish) the homework by 8?", ["have finished"], "سؤال المستقبل التام: Will + subject + have + V3"),
      M("Which sentence is correct?", ["By Friday, I have will finished the report.", "By Friday, I will have finished the report.", "By Friday, I will finished the report have.", "By Friday, I will have finish the report."], 1, "will + have + V3 (finished)")
    ] },
  { id: "3e", unit: 3, title: "Future Perfect Progressive",
    body: H.p("يُستخدم للتركيز على <b>مدة</b> الحدث الذي راح يستمر حتى وقت معين في المستقبل.") +
      H.formula("subject + will have been + V-ing") +
      H.rule("كلمات تدل عليه: <span class='en'>for + مدة</span> (for 15 years) و <span class='en'>by + وقت</span> (by 2030).") +
      H.h("أمثلة") +
      H.ex("By the year 2033, people <b>will have been flying</b> for 130 years.", "بحلول سنة 2033 يكون الناس قد ظلوا يطيرون لمدة 130 سنة.") +
      H.ex("By 2030, I <b>will have been living</b> in Sao Paulo for 15 years.", "بحلول 2030 أكون قد ظللت أعيش في ساو باولو لمدة 15 سنة.") +
      H.h("ملاحظة: الفرق بين الصيغتين") +
      H.p("أحياناً الصيغتان تعطيان نفس المعنى: <span class='en'>I will have lived in Sao Paulo for 15 years.</span> لكن <b>will have been living</b> تركّز أكثر على استمرار المدة.") +
      H.warn("خطأ شائع: <span class='en'>By 2030, I will have been live.</span> ✗ الصح: <span class='en'>I will have been living.</span> ✓"),
    quiz: [
      F("By June, I ___ (study) English for five years.", ["will have been studying"], "will have been + V-ing"),
      M("Which form focuses on the DURATION of an action before a future time?", ["will have been + V-ing", "will have + V3", "will + V", "be + V-ing"], 0, "المدة = will have been + V-ing"),
      F("By the end of this year, he ___ (drive) for 10 years.", ["will have been driving"], "المدة + will have been + V-ing"),
      M("By 2030, we ___ in this city for 20 years.", ["will have been living", "will living", "have will lived", "living will have"], 0, "will have been living"),
      M("Choose the correct structure:", ["will have been + V3", "will have been + V-ing", "will been + V-ing", "have been will + V"], 1, "will have been + V-ing")
    ] },
  { id: "3f", unit: 3, title: "The Future with Dependent Time Clauses",
    body: H.p("نتكلم عن حدث مستقبلي باستخدام جملة زمنية تبدأ بالكلمات: <span class='en'>when, before, after, while, until, as soon as</span>.") +
      H.rule("<b>الجملة الزمنية</b> (اللي تبدأ بالكلمة): نستخدم <b>المضارع البسيط</b> وليس will.<br>الجملة الرئيسية: نستخدم <b>will</b> أو <b>be going to</b>.") +
      H.h("أمثلة") +
      H.ex("My father <b>will keep</b> using his old-fashioned cord phone <b>until it breaks</b>.", "أبوي راح يستمر يستخدم جواله السلكي القديم إلى أن ينكسر.") +

];

/* ---------- Flashcards deck ---------- */
const DECK = [...VQC3, ...VVB3, ...RT3, ...VU4, ...RT4].map(w => ({ en: w[0], ar: w[1], def: w[2] }));

/* ---------- quiz engine ---------- */
function runQuiz(box, items, onDone) {
  let i = 0, score = 0;
  function show() {
    let answered = false;
    const it = items[i];
    box.innerHTML = `<div class="qhead"><span>سؤال ${i + 1} من ${items.length}</span><span>الصحيح: ${score}</span></div>
      <div class="progress"><i style="width:${(i / items.length) * 100}%"></i></div>
      <p class="qtext" dir="auto">${it.q}</p><div class="answers"></div><div class="fb"></div>`;
    const ans = box.querySelector(".answers");
    const fb = box.querySelector(".fb");
    function finish(ok, correct) {
      if (answered) return;
      answered = true;
      if (ok) score++;
      fb.innerHTML = `<div class="fbox ${ok ? "good" : "bad"}"><b>${ok ? "إجابة صحيحة ✓" : "إجابة غير صحيحة ✗"}</b>${ok ? "" : `<div>الإجابة الصحيحة: <span class="en">${correct}</span></div>`}${it.ex ? `<div class="exp">${it.ex}</div>` : ""}</div>
        <button class="btn next">${i < items.length - 1 ? "التالي" : "عرض النتيجة"}</button>`;
      fb.querySelector(".next").onclick = () => { i++; if (i < items.length) show(); else end(); };
    }
    if (it.o) {
      it.o.forEach((o, k) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.dir = "auto";
        b.innerHTML = o;
        b.onclick = () => {
          if (answered) return;
          const all = ans.querySelectorAll(".opt");
          b.classList.add(k === it.a ? "ok" : "bad");
          all[it.a].classList.add("ok");
          all.forEach(x => x.disabled = true);
          finish(k === it.a, it.o[it.a]);
        };
        ans.appendChild(b);
      });
    } else {
      ans.innerHTML = `<div class="fillrow"><input dir="ltr" autocomplete="off" placeholder="Type the answer"><button class="btn chk">تحقق</button></div>`;
      const inp = ans.querySelector("input"), chk = ans.querySelector(".chk");
      const go = () => {
        if (answered || !inp.value.trim()) return;
        const v = norm(inp.value);
        inp.disabled = true; chk.disabled = true;
        finish(it.a.some(x => norm(x) === v), it.a[0]);
      };
      chk.onclick = go;
      inp.onkeydown = e => { if (e.key === "Enter") go(); };
    }
  }
  function end() {
    const pct = Math.round((score / items.length) * 100);
    onDone(pct);
    box.innerHTML = `<div class="center"><div class="score">${pct}%</div><p>${score} إجابة صحيحة من ${items.length}</p>
      <p>${pct >= 80 ? "ممتاز، كمّل للدرس اللي بعده." : pct >= 60 ? "جيد، راجع الأخطاء وأعد الاختبار." : "راجع الشرح والأمثلة ثم أعد الاختبار."}</p>
      <button class="btn" id="again">أعد الاختبار</button></div>`;
    box.querySelector("#again").onclick = () => runQuiz(box, items, onDone);
  }
  show();
}

/* ---------- views ---------- */
let view = "u3", lessonId = null, cardQueue = null, flipped = false;

function activeTab() {
  if (view === "lesson") return "u" + LESSONS.find(x => x.id === lessonId).unit;
  return view;
}

function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === activeTab()));
  if (view === "u3" || view === "u4") renderUnit(view === "u3" ? 3 : 4);
  else if (view === "lesson") renderLesson();
  else if (view === "cards") renderCards();
  else if (view === "tests") renderTests();
  else if (view === "result") renderResult();
}

function renderUnit(n) {
  const list = LESSONS.filter(l => l.unit === n);
  $("#main").innerHTML = `
    <h2>${n === 3 ? "الوحدة 3: What Will They Think of Next?" : "الوحدة 4: The World of TV"}</h2>
    <div class="box">
      <b>طريقة المذاكرة:</b>
      <div>١. اقرأ الشرح والأمثلة في الدرس.</div>
      <div>٢. حل الاختبار القصير تحت الدرس (يعطيك الإجابة الصحيحة فوراً).</div>
      <div>٣. راجع الكلمات في تبويب <b>البطاقات</b> كل يوم.</div>
    </div>
    <div class="grid">${list.map(l => {
      const s = st.lessons[l.id];
      return `<button class="card" data-id="${l.id}"><div class="t">${l.title}</div><div class="m">${s !== undefined ? `<span class="pill">أفضل نتيجة ${s}%</span>` : "لم تُختبر بعد"}</div></button>`;
    }).join("")}</div>`;
  $("#main").querySelectorAll(".card").forEach(b => b.onclick = () => {
    lessonId = b.dataset.id;
    view = "lesson";
    render();
    window.scrollTo(0, 0);
  });
}

function renderLesson() {
  const L = LESSONS.find(x => x.id === lessonId);
  $("#main").innerHTML = `
    <button class="back" id="back">← رجوع للوحدة</button>
    <h2>${L.title}</h2>
    <div class="box">${L.body}</div>
    <div class="quiz"><h3>اختبر نفسك</h3><div id="qbox"></div></div>`;
  $("#back").onclick = () => { view = "u" + L.unit; render(); window.scrollTo(0, 0); };
  runQuiz($("#qbox"), L.quiz, pct => {
    st.lessons[L.id] = Math.max(pct, st.lessons[L.id] ?? 0);
    save();
  });
}

function renderCards() {
  const box = $("#main");
  if (!cardQueue) cardQueue = shuffle(DECK.filter(c => !st.known.includes(c.en)));
  if (!cardQueue.length) {
    box.innerHTML = `<h2>البطاقات</h2><div class="box center"><h3>خلصت كل البطاقات!</h3><p>كل الكلمات محفوظة عندك حالياً.</p><button class="btn" id="rs">أعد التوزيع الكامل</button></div>`;
    $("#rs").onclick = resetKnown;
    return;
  }
  const c = cardQueue[0];
  box.innerHTML = `<h2>بطاقات المفردات والعبارات</h2>
    <p class="sub">اضغط البطاقة لتشوف المعنى. "عرفتها" تختفي من الجلسة، و"ما عرفتها" ترجع لآخر الدور.</p>
    <div class="flash" id="fc">${flipped
      ? `<div><div class="fb-ar">${c.ar}</div><div class="fb-def en">${c.def}</div></div>`
      : `<div><div class="fb-en en">${c.en}</div><div class="hint">اضغط لعرض المعنى</div></div>`}</div>
    <div class="fbtns"><button class="btn ghost" id="no">ما عرفتها</button><button class="btn" id="yes">عرفتها ✓</button></div>
    <div class="count">متبقي ${cardQueue.length} · محفوظ ${st.known.length} من ${DECK.length}</div>`;
  $("#fc").onclick = () => { flipped = !flipped; renderCards(); };
  $("#yes").onclick = () => {
    if (!st.known.includes(c.en)) st.known.push(c.en);
    save();
    cardQueue.shift();
    flipped = false;
    renderCards();
  };
  $("#no").onclick = () => { cardQueue.push(cardQueue.shift()); flipped = false; renderCards(); };
}

function resetKnown() {
  st.known = [];
  save();
  cardQueue = null;
  flipped = false;
  renderCards();
}

function renderTests() {
  $("#main").innerHTML = `<h2>الاختبارات العامة (الوحدتين)</h2>
    <p class="sub">ثلاث اختبارات تغطي الوحدة 3 والوحدة 4 معاً. بعد إكمالها تظهر النتيجة النهائية في تبويب النتيجة.</p>
    <div class="grid" id="tlist" style="margin:12px 0"></div><div id="tbox"></div>`;
  const list = $("#tlist");
  TESTS.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = `<div class="t">${t.name}</div><div class="m">${st.tests[i + 1] !== undefined ? `<span class="pill">نتيجتك ${st.tests[i + 1]}%</span>` : "لم يُختبر بعد"} · ${t.items.length} سؤال</div>`;
    b.onclick = () => {
      $("#tbox").scrollIntoView({ behavior: "smooth", block: "start" });
      runQuiz($("#tbox"), t.items, p => { st.tests[i + 1] = p; save(); });
    };
    list.appendChild(b);
  });
}

function renderResult() {
  const done = LESSONS.filter(x => st.lessons[x.id] !== undefined);
  const lessonAvg = done.length ? Math.round(done.reduce((s, x) => s + st.lessons[x.id], 0) / done.length) : 0;
  const t = [1, 2, 3].map(n => st.tests[n]);
  const allT = t.every(x => x !== undefined);
  const finalPct = allT ? Math.round(t.reduce((a, b) => a + b, 0) / 3) : null;
  const weak = done.filter(x => st.lessons[x.id] < 70).map(x => x.title);
  const msg = finalPct === null ? "أكمل الاختبارات الثلاثة لتظهر نتيجتك النهائية."
    : finalPct >= 90 ? "ممتاز! فاهم الوحدتين بشكل قوي. راجع البطاقات قبل الاختبار بيوم."
    : finalPct >= 75 ? "جيد جداً، بس راجع النقاط اللي أخذت فيها أخطاء."
    : finalPct >= 60 ? "جيد. راجع الدروس الضعيفة وأعد الاختبارات."
    : "تحتاج مراجعة أكثر. ابدأ بالشرح من جديد وركّز على القواعد.";
  $("#main").innerHTML = `<h2>نتيجتك</h2>
    <div class="box center">
      <div class="score">${finalPct === null ? "—" : finalPct + "%"}</div>
      <p>${msg}</p>
    </div>
    <div class="stat"><span>الاختبار 1: المفردات والعبارات</span><b>${t[0] !== undefined ? t[0] + "%" : "لم يُختبر"}</b></div>
    <div class="stat"><span>الاختبار 2: القواعد</span><b>${t[1] !== undefined ? t[1] + "%" : "لم يُختبر"}</b></div>
    <div class="stat"><span>الاختبار 3: شامل</span><b>${t[2] !== undefined ? t[2] + "%" : "لم يُختبر"}</b></div>
    <div class="stat"><span>الدروس المكتملة</span><b>${done.length} من ${LESSONS.length}</b></div>
    <div class="stat"><span>متوسط الدروس</span><b>${done.length ? lessonAvg + "%" : "—"}</b></div>
    <div class="stat"><span>البطاقات المحفوظة</span><b>${st.known.length} من ${DECK.length}</b></div>
    ${weak.length ? `<h3>دروس تحتاج مراجعة (أقل من 70%)</h3><ul>${weak.map(w => `<li>${w}</li>`).join("")}</ul>` : ""}
    <div class="center" style="margin-top:16px"><button class="btn ghost" id="reset">امسح التقدم وابدأ من جديد</button></div>`;
  let armed = false;
  $("#reset").onclick = () => {
    if (!armed) { armed = true; $("#reset").textContent = "اضغط مرة ثانية للتأكيد"; return; }
    st = { lessons: {}, tests: {}, known: [] };
    save();
    cardQueue = null;
    view = "u3";
    render();
  };
}

/* ---------- navigation ---------- */
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => {
  view = b.dataset.v;
  render();
  window.scrollTo(0, 0);
});
render();
</script>
</body>
</html>
